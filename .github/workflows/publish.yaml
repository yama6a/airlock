# Publishes latest, <claude>, and <claude>-<n> to GHCR and tags the commit <claude>-<n>.
# n counts publishes of that Claude version.
name: Publish

on:
  push:
    branches: [main]
    paths: [Dockerfile, entrypoint.sh, airlock, lib/seed.sh]
  workflow_dispatch:

# Queued, never cancelled: two runs at once would read the same tag list and pick the same n.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs first so the builds can stamp the tag into the image, where airlock reads it back.
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          claude="$(sed -n 's/^ARG CLAUDE_VERSION=//p' Dockerfile)"
          [[ -n "$claude" ]] || { echo "no CLAUDE_VERSION in Dockerfile" >&2; exit 1; }

          token="$(curl -fsSL -u "$GITHUB_ACTOR:$GITHUB_TOKEN" \
            "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r .token)"
          status="$(curl -sS -o tags.json -w '%{http_code}' -H "Authorization: Bearer $token" \
            "https://ghcr.io/v2/$repo/tags/list?n=10000")"
          # 404 means no package yet. Stop on anything else, or n restarts at 1 and overwrites a tag.
          case "$status" in
            200) tags="$(jq -r '.tags // [] | .[]' tags.json)" ;;
            404) tags="" ;;
            *) echo "tag list returned HTTP $status" >&2; cat tags.json >&2; exit 1 ;;
          esac
          last="$(awk -F- -v v="$claude" 'NF == 2 && $1 == v && $2 ~ /^[0-9]+$/ { print $2 }' <<< "$tags" \
            | sort -n | tail -1)"
          echo "version=$claude-$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest only, so nothing is tagged until the publish job has both arches.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # airlock compares this against the GHCR tag list to announce a newer image.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.tag.outputs.version }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          # CI's PR build reads the amd64 scope.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          refs=()
          for f in "$RUNNER_TEMP"/digests/*; do refs+=("$image@sha256:${f##*/}"); done
          docker buildx imagetools create \
            -t "$image:latest" -t "$image:${VERSION%-*}" -t "$image:$VERSION" "${refs[@]}"
          echo "published $image:$VERSION" >> "$GITHUB_STEP_SUMMARY"
      # airlock --self-update downloads the launcher from this tag, so it matches the image.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$VERSION" -f "sha=$GITHUB_SHA"
