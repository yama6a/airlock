# Publishes the arm64 image to GHCR as latest, <claude> and <claude>-<n>, and releases <claude>-<n>.
# n counts publishes of that Claude version.
name: Publish

on:
  push:
    branches: [main]
    paths: [Dockerfile, entrypoint.sh, airlock, lib/seed.sh, .github/workflows/publish.yaml]
  workflow_dispatch:

# Queued, never cancelled: two runs at once would read the same tag list and pick the same n.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          claude="$(sed -n 's/^ARG CLAUDE_VERSION=//p' Dockerfile)"
          [[ -n "$claude" ]] || { echo "no CLAUDE_VERSION in Dockerfile" >&2; exit 1; }

          token="$(curl -fsSL -u "$GITHUB_ACTOR:$GITHUB_TOKEN" \
            "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r .token)"
          status="$(curl -sS -o tags.json -w '%{http_code}' -H "Authorization: Bearer $token" \
            "https://ghcr.io/v2/$repo/tags/list?n=10000")"
          # 404 means no package yet. Stop on anything else, or n restarts at 1 and overwrites a tag.
          case "$status" in
            200) tags="$(jq -r '.tags // [] | .[]' tags.json)" ;;
            404) tags="" ;;
            *) echo "tag list returned HTTP $status" >&2; cat tags.json >&2; exit 1 ;;
          esac
          last="$(awk -F- -v v="$claude" 'NF == 2 && $1 == v && $2 ~ /^[0-9]+$/ { print $2 }' <<< "$tags" \
            | sort -n | tail -1)"
          {
            echo "version=$claude-$(( ${last:-0} + 1 ))"
            echo "claude=$claude"
            echo "image=ghcr.io/$repo"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:latest
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.claude }}
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.version }}
          # airlock compares the version label against the GHCR tag list to announce a newer image.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
          # CI's PR build reads this scope.
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
      # Also creates the git tag, which airlock --self-update downloads the launcher from.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          cat > notes.md << EOF
          ## Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | bash
          \`\`\`

          Already installed? Run \`airlock --self-update\`. Both get the newest release.

          Image: \`$IMAGE:$VERSION\`, Apple Silicon only.

          EOF
          gh release create "$VERSION" --target "$GITHUB_SHA" --latest --generate-notes -F notes.md
