# Self-hosted Renovate. Reads /renovate.json5 from the cloned repo automatically.
name: Renovate

on:
  schedule:
    # Two runs a night, 30 min apart: the first opens PRs, the second merges the ones whose CI went green.
    # Renovate never merges on the run that opened a PR, so a single nightly run would add a day of lag.
    - cron: "13 5 * * *"
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info
        type: choice
        options: [info, debug]
      dryRun:
        description: Dry run (extract + plan, open no PRs)
        default: false
        type: boolean

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read # Renovate acts through RENOVATE_TOKEN, not GITHUB_TOKEN

jobs:
  renovate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: renovatebot/github-action@c314dda4a9a93b08239ec978f2043b9a433b9ac4 # v46.3.0
        with:
          # A dedicated PAT: GITHUB_TOKEN cannot open PRs that re-trigger workflows, and lacks the scope.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }} # this repo only, no org-wide autodiscover
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
